name: Sondar API
on:
  push:
    branches: [ "probe/**" ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Sondar
        run: |
          chmod +x gradlew
          ./gradlew compileJava -q > /dev/null 2>&1 || true
          CP=$(find ~/.gradle .gradle -name "*.jar" 2>/dev/null | grep -i minecraft | grep -v sources | paste -sd:)
          for J in $(echo $CP | tr ':' ' '); do unzip -l "$J" 2>/dev/null | grep -E "WanderingTrader.class|/Schedule.class|/Activity.class|VillagerProfession.class|VillagerData.class|Timeline" ; done | sort -u | head -30
          p() { echo "=================== $1 ($2)"; javap -p -cp "$CP" "$1" 2>&1 | grep -iE "$2" | head -60; }
          p net.minecraft.world.entity.ai.Brain "schedule|activity|Activity|public"
          p net.minecraft.world.entity.schedule.Schedule "static|public"
          p net.minecraft.world.entity.schedule.Activity "static"
          p net.minecraft.world.entity.npc.villager.VillagerData "public"
          p net.minecraft.world.entity.npc.villager.VillagerProfession "static|public"
          p net.minecraft.world.entity.npc.villager.Villager "refreshBrain|registerBrainGoals|setVillagerData|getVillagerData|brain|Brain"
          p net.minecraft.world.entity.npc.wanderingtrader.WanderingTrader "class|public"
          p net.minecraft.world.entity.npc.WanderingTrader "class|public"
          p net.minecraft.world.level.Level "rain|thunder|Rain|Thunder"
          p net.minecraft.world.entity.Mob "setItemSlot|getItemBySlot"
          p net.minecraft.world.entity.LivingEntity "setItemSlot|getItemBySlot|getMainHandItem"
          p net.minecraft.core.registries.BuiltInRegistries "VILLAGER_PROFESSION|ACTIVITY|SCHEDULE"
          p net.minecraft.world.entity.ai.memory.MemoryModuleType "JOB_SITE|MEETING_POINT|HOME"
